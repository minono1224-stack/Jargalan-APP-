<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чандмань-Өндөр СӨБ - Нэвтрэх болон Бүртгэл</title>
    <style>
        :root {
            --primary-color: #ff6b81;
            --primary-hover: #ff4757;
            --bg-color: #fff1f2;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --border-color: #ffdde1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fbc531 0%, #ff6b81 50%, #70a1ff 100%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 4px solid #fff;
        }

        h2 {
            margin-bottom: 8px;
            color: var(--primary-color);
            text-align: center;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #747d8c;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #57606f;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            background-color: #fff9fa;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(255, 107, 129, 0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #70a1ff;
            box-shadow: 0 4px 15px rgba(112, 161, 255, 0.4);
        }

        .btn-secondary:hover {
            background-color: #1e90ff;
        }

        .switch-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #57606f;
        }

        .switch-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. НЭВТРЭХ ХЭСЭГ -->
        <div id="loginView" class="form-section active">
            <h2>🧸 Нэвтрэх хэсэг 🎨</h2>
            <p class="subtitle">Системд бүртгэлтэй утас, Gmail болон нууц үгээрээ орно</p>
            
            <form onsubmit="event.preventDefault(); alert('Амжилттай нэвтэрлээ!');">
                <div class="form-group">
                    <label>📱 Утасны дугаар эсвэл Gmail хаяг</label>
                    <input type="text" placeholder="Жишээ: 99112233 эсвэл admin@gmail.com" required>
                </div>

                <div class="form-group">
                    <label>🔒 Нууц үг</label>
                    <input type="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn">🚀 Системд Нэвтрэх</button>
            </form>

            <div class="switch-text">
                <p>Цэцэрлэгээ бүртгүүлэхээ амжаагүй байна уу? <a onclick="switchView('registerView')">Энд дарж бүртгүүлэх</a></p>
            </div>
        </div>

        <!-- 2. ЦЭЦЭРЛЭГ БҮРТГҮҮЛЭХ ХЭСЭГ -->
        <div id="registerView" class="form-section">
            <h2>🏫 Цэцэрлэг Бүртгүүлэх</h2>
            <p class="subtitle">Цэцэрлэгийн эрхлэгч эсвэл эрх олгогдсон хүн шинээр бүртгэнэ[cite: 1]</p>
            
            <form onsubmit="event.preventDefault(); alert('Цэцэрлэгийн бүртгэл амжилттай үүслээ! Баталгаажуулах код илгээгдлээ.');">
                <div class="form-group">
                    <label>🏛️ Цэцэрлэгийн албан ёсны нэр</label>
                    <input type="text" placeholder="Жишээ: Чандмань-Өндөр СӨБ" required>
                </div>

                <div class="form-group">
                    <label>🔢 Байгууллагын бүртгэлийн дугаар</label>
                    <input type="text" placeholder="Татвар / Улсын бүртгэлийн дугаар" required>
                </div>

                <div class="form-group">
                    <label>👤 Эрхлэгч / Бүртгүүлэгчийн овог нэр</label>
                    <input type="text" placeholder="Таны бүтэн нэр" required>
                </div>

                <div class="form-group">
                    <label>📞 Холбогдох утасны дугаар</label>
                    <input type="text" placeholder="8утасны дугаар" required>
                </div>

                <div class="form-group">
                    <label>✉️ Gmail хаяг</label>
                    <input type="email" placeholder="example@gmail.com" required>
                </div>

                <button type="submit" class="btn btn-secondary">✨ Цэцэрлэг Бүртгүүлэх & Код авах</button>
            </form>

            <div class="switch-text">
                <p>Бүртгэлтэй бол <a onclick="switchView('loginView')">Буцаад нэвтрэх</a></p>
            </div>
        </div>

    </div>

    <script>
        // Нэвтрэх болон Бүртгүүлэх форм хооронд шилжих функц
        function switchView(viewId) {
            document.querySelectorAll('.form-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(viewId).classList.add('active');
        }
    </script>
</body>
</html>
