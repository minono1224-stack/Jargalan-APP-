<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чандмань-Өндөр СӨБ - Бүлгийн Багшийн Самбар</title>
    <style>
        :root {
            --primary-color: #ff6b81;
            --primary-hover: #ff4757;
            --bg-color: #fff1f2;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --border-color: #ffdde1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fbc531 0%, #ff6b81 50%, #70a1ff 100%);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 4px solid #fff;
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #747d8c;
            margin-bottom: 25px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #dfe4ea;
            padding: 10px 12px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #ffeaa7;
            color: #2d3436;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff9fa;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--primary-color);
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background-color: #2ed573;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
        }

        .save-btn:hover {
            background-color: #26af5f;
            transform: translateY(-2px);
        }

        .back-btn {
            background-color: #70a1ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .back-btn:hover { background-color: #1e90ff; }
    </style>
</head>
<body>

    <div class="container">
        <button class="back-btn" onclick="window.location.href='login.html'">⬅️ Буцах / Гарах</button>
        
        <h2>🖍️ Бүлгийн Багшийн Самбар</h2>
        <p class="subtitle">Өдрийн ирц бүртгэх (Өвчтэй, чөлөөтэй, шалтгаан) болон хүүхдийн хөгжлийн түвшин (СҮД) үнэлэх</p>

        <table>
            <thead>
                <tr>
                    <th>Бүлэг</th>
                    <th>Хүүхдийн нэр</th>
                    <th>Өдрийн ирц</th>
                    <th>Шалтгаан (Өвчтэй/Чөлөөтэй бол)</th>
                    <th>Суралцахуйн үр дүнгийн түвшин (СҮД)</th>
                </tr>
            </thead>
            <tbody id="teacherTableBody">
                <!-- db.js-ээс мэдээлэл татагдаж орно -->
            </tbody>
        </table>

        <button class="save-btn" onclick="saveTeacherData()">💾 Өөрчлөлтийг Хадгалах (Эмч & Удирдлага руу илгээх)</button>
    </div>

    <!-- Дундын өгөгдлийн сантай холбогдох холбоос -->
    <script src="db.js"></script>
    <script>
        function loadTeacherTable() {
            const children = SOB_DB.getChildren();
            const tbody = document.getElementById('teacherTableBody');
            
            tbody.innerHTML = children.map((c, index) => `
                <tr>
                    <td><b>${c.group}</b></td>
                    <td>${c.name}</td>
                    <td>
                        <select id="att_${index}">
                            <option value="Ирсэн" ${c.attendance === 'Ирсэн' ? 'selected' : ''}>🟢 Ирсэн</option>
                            <option value="Өвчтэй" ${c.attendance === 'Өвчтэй' ? 'selected' : ''}>🔴 Өвчтэй</option>
                            <option value="Чөлөөтэй" ${c.attendance === 'Чөлөөтэй' ? 'selected' : ''}>🟡 Чөлөөтэй</option>
                            <option value="Тасалсан" ${c.attendance === 'Тасалсан' ? 'selected' : ''}>⚫ Тасалсан</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" id="reason_${index}" value="${c.reason || ''}" placeholder="Жишээ: Ханиад хүрсэн...">
                    </td>
                    <td>
                        <select id="sud_${index}">
                            <option value="Бие даан гүйцэтгэдэг" ${c.sudLevel === 'Бие даан гүйцэтгэдэг' ? 'selected' : ''}>🌟 Бие даан гүйцэтгэдэг</option>
                            <option value="Дэмжлэгтэй гүйцэтгэдэг" ${c.sudLevel === 'Дэмжлэгтэй гүйцэтгэдэг' ? 'selected' : ''}>🤝 Дэмжлэгтэй гүйцэтгэдэг</option>
                            <option value="Хараахан эзэмшээгүй" ${c.sudLevel === 'Хараахан эзэмшээгүй' ? 'selected' : ''}>📌 Хараахан эзэмшээгүй</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        function saveTeacherData() {
            const children = SOB_DB.getChildren();
            
            children.forEach((c, index) => {
                c.attendance = document.getElementById(`att_${index}`).value;
                c.reason = document.getElementById(`reason_${index}`).value;
                c.sudLevel = document.getElementById(`sud_${index}`).value;
            });

            // Дундын санд хадгалах
            SOB_DB.saveChildren(children);
            alert("✅ Ирц болон хүүхдийн үнэлгээ амжилттай хадгалагдлаа!\nОдоо Эрхлэгч болон Эмчийн самбарт автоматаар дамжлаа.");
        }

        window.onload = loadTeacherTable;
    </script>
</body>
</html>
